.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar-left,.toolbar-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.page-title{font-size:21px;letter-spacing:-.035em;margin:0}.subtle{color:var(--muted);font-size:12px}.btn{border:1px solid #344965;color:#deebfb;background:#1a2a41;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:800;transition:.15s}.btn:hover{background:#263b59;border-color:#52739b;transform:translateY(-1px)}.btn.primary{background:#267b61;border-color:#349c78;color:white}.btn.primary:hover{background:#2b9471}.btn.ghost{background:transparent}.btn.danger{border-color:#71404c;color:#ffb1b8;background:#321f2a}.btn.small{padding:6px 9px;font-size:11px}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}

.grid-main{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(390px,.88fr);gap:14px;align-items:start}.card{background:linear-gradient(150deg,#142138,#101a2b);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 17px;border-bottom:1px solid var(--line)}.card-head h2{font-size:14px;letter-spacing:-.015em;margin:0}.card-head .subtle{margin-top:3px}.card-body{padding:14px 16px}.table-wrap{overflow:auto;max-height:690px}.league-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}.league-table th{position:sticky;top:0;background:#17263b;color:#90a4c0;text-align:right;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:10px 8px;z-index:2}.league-table th:nth-child(2),.league-table td:nth-child(2){text-align:left}.league-table td{padding:8px;border-top:1px solid #25334a;text-align:right;color:#c8d4e5}.league-table tbody tr:hover{background:#1a2a40}.league-table .pos{text-align:center;width:30px;color:#8da2bf}.league-table .club{font-weight:800;color:#edf3fc;max-width:175px;overflow:hidden;text-overflow:ellipsis}.team-cell{display:flex;gap:8px;align-items:center}.mini-crest{height:21px;width:21px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:8px;font-weight:900;color:#f4f7fc;border:1px solid #ffffff25}.zone{width:3px;height:24px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}.zone.auto{background:var(--green)}.zone.semi{background:var(--blue)}.zone.elim{background:var(--gold)}.zone.down{background:var(--red)}.league-table tr.zone-auto{background:#14352f35}.league-table tr.zone-semi{background:#1b315435}.league-table tr.zone-elim{background:#3b332335}.league-table tr.zone-down{background:#3d242b35}.legend{display:flex;flex-wrap:wrap;gap:12px;padding:11px 16px;border-top:1px solid var(--line);color:#9eafc7;font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.round-controls{display:flex;align-items:center;gap:7px}.round-controls select,.field select,.field input,.round-select{background:#0d1726;color:var(--text);border:1px solid #344761;border-radius:8px;padding:8px 9px;font-size:12px;min-width:0}.round-select{font-weight:800}.match-list{display:flex;flex-direction:column;gap:8px}.match{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 9px;border:1px solid #293a52;border-radius:11px;background:#111d2e}.match .side{display:flex;align-items:center;gap:7px;min-width:0;font-size:11px;font-weight:750}.match .side.away{justify-content:flex-end;text-align:right}.match .side span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.match .score{font-weight:900;text-align:center;font-size:14px;letter-spacing:.04em}.match .score.pending{color:#8193ad;font-size:11px}.match-actions{display:flex;gap:5px}.match-meta{font-size:9px;color:#8398b5;margin-top:2px}.club-badge{height:22px;width:22px;display:grid;place-items:center;border-radius:7px;flex:none;font-size:8px;font-weight:900;border:1px solid #ffffff25}
.full-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fixture-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.fixture-date{font-size:10px;color:#91a4bf}.team-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.team-editor{display:grid;grid-template-columns:34px minmax(0,1fr) 86px;gap:9px;align-items:center;border:1px solid #293a52;background:#111d2e;border-radius:11px;padding:10px}.team-editor input{width:100%;background:#0d1726;color:#edf3fc;border:1px solid #344761;border-radius:7px;padding:7px 8px;font-size:11px}.team-editor .rating{display:flex;gap:4px;align-items:center}.team-editor .rating input{width:48px;text-align:center}.team-editor small{color:#8ea2be;font-size:9px}
.rule-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.rule{padding:13px;border:1px solid #2a3c55;border-radius:11px;background:#111d2e}.rule strong{display:block;font-size:14px}.rule span{color:#91a4bf;font-size:10px}.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}.bracket-col{display:flex;flex-direction:column;gap:10px}.bracket-col h3{margin:0 0 2px;color:#a6bad4;font-size:10px;text-transform:uppercase;letter-spacing:.13em}.tie-card{padding:12px;border:1px solid #30435f;border-radius:12px;background:#111d2e}.tie-card .tie-title{font-size:10px;color:#8fa4c2;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.tie-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:11px;font-weight:800}.tie-row .winner{color:var(--green)}.tie-score{font-variant-numeric:tabular-nums;font-weight:900;font-size:13px}.tie-note{font-size:9px;color:#90a4bf;margin-top:8px}.empty-state{padding:30px 18px;text-align:center;color:#95a9c5}.empty-state strong{display:block;color:#e3ecf8;font-size:15px;margin-bottom:5px}.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid #2d4d46;border-radius:999px;color:#9ce7c7;background:#14352e;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.status-pill.locked{border-color:#3a4659;background:#1b2637;color:#9aabc3}
.footer-tools{display:flex;gap:8px;flex-wrap:wrap}.modal-backdrop{position:fixed;inset:0;background:#030813c9;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(480px,100%);background:#142138;border:1px solid #3a5273;border-radius:16px;box-shadow:0 30px 100px #0009;overflow:hidden}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:17px 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#9fb0c8;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.field input,.field select{width:100%;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dff8eb;color:#103627;padding:10px 15px;border-radius:999px;font-size:12px;font-weight:850;box-shadow:0 10px 35px #0008;z-index:40;display:none}.hidden{display:none!important}.helper{font-size:10px;color:#8fa4bf;margin-top:8px}.divider{height:1px;background:var(--line);margin:14px 0}.info-box{padding:12px 13px;border:1px solid #2b4668;border-radius:10px;background:#142945;color:#bad0ed;font-size:11px}
@media(max-width:1000px){.grid-main{grid-template-columns:1fr}.full-grid{grid-template-columns:1fr}.bracket{grid-template-columns:1fr}.bracket-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.bracket-col h3{grid-column:1/-1}}
@media(max-width:650px){.topbar{padding:18px 15px 14px}.shell{padding:0 14px 28px}.brand h1{font-size:19px}.season-pill{font-size:10px;padding:7px 9px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:12px}.kpi .value{font-size:22px}.team-list{grid-template-columns:1fr}.team-editor{grid-template-columns:32px minmax(0,1fr) 82px}.rule-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.match{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:5px}.match-actions{grid-column:1/-1;justify-content:flex-end}.match .side{font-size:10px}.bracket-col{grid-template-columns:1fr}.toolbar{align-items:flex-start}.toolbar-right{width:100%}.form-grid{grid-template-columns:1fr 1fr}}

<body>
<div id="app"></div>
<script>
'use strict';
const SAVE_KEY='second-division-road-to-promotion-v1';
const TEAM_SEED=[
 ['northport','Northport United','NOR','#3176ba',83,'Harbour Park'],['kingsbridge','Kingsbridge FC','KIN','#d94d54',82,'Royal Ground'],['redhaven','Redhaven Athletic','RED','#bd4d61',80,'Foundry Lane'],['westmoor','Westmoor City','WMC','#5687a8',79,'Moorfield Stadium'],['eastford','Eastford Rovers','EAS','#d69b39',78,'Riverside Park'],['ironbridge','Ironbridge Town','IBT','#9b6b46',77,'The Ironworks'],['lakeside','Lakeside FC','LAK','#3c9b8b',76,'Lakeview Arena'],['southgate','Southgate Albion','SOU','#d5d8e6',75,'Albion Road'],['brookvale','Brookvale United','BRO','#8b69c1',74,'Brookvale Park'],['highfield','Highfield Wanderers','HIG','#b1a14c',73,'The Heights'],['ashford','Ashford County','ASH','#ba7746',72,'County Ground'],['millchester','Millchester FC','MIL','#4c7fc5',71,'Mill End'],['stonebury','Stonebury Town','STO','#8f9bab',70,'Quarry Stadium'],['fairmont','Fairmont Athletic','FAI','#4f9d65',69,'Fairmont Lane'],['greenford','Greenford City','GRE','#4b9d79',68,'Green Park'],['oakhampton','Oakhampton FC','OAK','#a6a65b',67,'Oak Stadium'],['rivermouth','Rivermouth United','RIV','#3c91a5',66,'The Estuary'],['caldervale','Calder Vale','CAL','#8068a8',65,'Vale Ground'],['newashton','New Ashton','NAS','#c17775',64,'Ashton Field'],['portchester','Portchester Albion','POR','#6280ad',63,'Portchester Park'],['wexley','Wexley Town','WEX','#b2884c',62,'Wexley Arena'],['dunhaven','Dunhaven FC','DUN','#69869e',61,'Dunhaven Road'],['bellford','Bellford Rovers','BEL','#a55f7a',60,'Bellford Stadium'],['norchester','Norchester City','NOC','#6c758d',59,'Norchester Lane']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamById=id=>state.teams.find(t=>t.id===id);
function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function prettyDate(s){if(!s)return 'Date TBC';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function makeSchedule(teams){
 let ring=teams.map(t=>t.id),first=[];const n=ring.length;
 for(let r=0;r<n-1;r++){
  const games=[];
  for(let i=0;i<n/2;i++){
   let a=ring[i],b=ring[n-1-i];
   if(r%2===0)games.push({homeId:a,awayId:b});else games.push({homeId:b,awayId:a});
  }
  first.push(games);ring=[ring[0],ring[n-1],...ring.slice(1,n-1)];
 }
 const start=new Date(2026,7,8),fixtures=[];
 for(let r=0;r<46;r++){
  const base=first[r%23];const games=r<23?base:base.map(g=>({homeId:g.awayId,awayId:g.homeId}));
  const day=new Date(start);day.setDate(start.getDate()+r*7);
  games.forEach((g,i)=>fixtures.push({id:`L${r+1}-${i+1}`,type:'league',round:r+1,date:dateISO(day),kickoff:i===5?'17:30':'15:00',venue:teamByIdFrom(teams,g.homeId).stadium,...g,played:false,homeGoals:null,awayGoals:null}));
 }
 return fixtures;
}
function teamByIdFrom(teams,id){return teams.find(t=>t.id===id)}
function freshState(){const teams=TEAM_SEED.map(([id,name,short,color,strength,stadium])=>({id,name,short,color,strength,stadium}));return {season:'2026/27',teams,fixtures:makeSchedule(teams),currentRound:1,activeTab:'overview',playoffs:null,modal:null}}
let state=freshState();
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.teams)&&parsed.teams.length===24&&Array.isArray(parsed.fixtures)&&parsed.fixtures.length===552){state={...freshState(),...parsed,modal:null};}}catch(e){console.warn('Save could not be loaded',e)}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){console.warn('Autosave unavailable',e)}}
function stats(){const out={};state.teams.forEach(t=>out[t.id]={team:t,played:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});
 const done=state.fixtures.filter(f=>f.played).sort((a,b)=>a.round-b.round||a.id.localeCompare(b.id));
 done.forEach(f=>{const h=out[f.homeId],a=out[f.awayId];if(!h||!a)return;h.played++;a.played++;h.gf+=f.homeGoals;h.ga+=f.awayGoals;a.gf+=f.awayGoals;a.ga+=f.homeGoals;if(f.homeGoals>f.awayGoals){h.w++;h.pts+=3;a.l++;h.form.push('W');a.form.push('L')}else if(f.homeGoals<f.awayGoals){a.w++;a.pts+=3;h.l++;a.form.push('W');h.form.push('L')}else{h.d++;a.d++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}});
 return Object.values(out).map(x=>({...x,gd:x.gf-x.ga,form:x.form.slice(-5)})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||b.w-a.w||a.team.name.localeCompare(b.team.name));}
function rankOf(id,table=stats()){return table.findIndex(x=>x.team.id===id)+1}
function teamOptionList(selected){return state.teams.map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('')}
function crest(team,small=false){if(!team)return '';return `<span class="${small?'club-badge':'mini-crest'}" style="background:${esc(team.color)}">${esc(team.short.slice(0,3))}</span>`}
function rankZone(pos){if(pos<=2)return 'auto';if(pos<=4)return 'semi';if(pos<=8)return 'elim';if(pos>=22)return 'down';return 'none'}
function tableHtml(){const t=stats();return `<div class="table-wrap"><table class="league-table"><thead><tr><th class="pos">#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${t.map((x,i)=>{const zone=rankZone(i+1);return `<tr class="zone-${zone}"><td class="pos"><span class="zone ${zone}"></span>${i+1}</td><td class="club"><span class="team-cell">${crest(x.team)}<span>${esc(x.team.name)}</span></span></td><td>${x.played}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd>0?'+':''}${x.gd}</td><td><strong style="color:#fff">${x.pts}</strong></td></tr>`}).join('')}</tbody></table></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i> automatic promotion</span><span><i class="dot" style="background:var(--blue)"></i> playoff semi-final</span><span><i class="dot" style="background:var(--gold)"></i> eliminator</span><span><i class="dot" style="background:var(--red)"></i> relegation</span></div>`}
function matchRow(f){const h=teamById(f.homeId),a=teamById(f.awayId);const score=f.played?`${f.homeGoals} – ${f.awayGoals}`:'vs';return `<div class="match"><div class="side">${crest(h,true)}<span>${esc(h?.name||'Unknown club')}</span></div><div><div class="score ${f.played?'':'pending'}">${score}</div><div class="match-meta">${esc(f.kickoff||'15:00')}</div></div><div class="side away"><span>${esc(a?.name||'Unknown club')}</span>${crest(a,true)}</div><div class="match-actions"><button class="btn small ghost" data-action="edit-fixture" data-id="${esc(f.id)}">edit</button><button class="btn small ${f.played?'':'primary'}" data-action="result" data-id="${esc(f.id)}">${f.played?'score':'result'}</button></div></div>`}
function roundFixtures(round){return state.fixtures.filter(f=>f.round===round).sort((a,b)=>a.id.localeCompare(b.id))}
function roundComplete(r){return roundFixtures(r).every(f=>f.played)}
function playedCount(){return state.fixtures.filter(f=>f.played).length}
function firstOpenRound(){for(let r=1;r<=46;r++)if(!roundComplete(r))return r;return 46}
function roundPicker(){return `<div class="round-controls"><button class="btn small" data-action="prev-round" ${state.currentRound===1?'disabled':''}>‹</button><select class="round-select" data-role="round-select">${Array.from({length:46},(_,i)=>`<option value="${i+1}" ${state.currentRound===i+1?'selected':''}>matchday ${i+1}</option>`).join('')}</select><button class="btn small" data-action="next-round" ${state.currentRound===46?'disabled':''}>›</button></div>`}
function renderKpis(){const p=playedCount(),complete=Array.from({length:46},(_,i)=>roundComplete(i+1)).filter(Boolean).length;const upcoming=state.fixtures.find(f=>!f.played);return `<div class="kpis"><div class="kpi"><div class="label">matchdays complete</div><div class="value">${complete}<span style="color:#7f93af;font-size:15px"> / 46</span></div><div class="hint">double round-robin season</div></div><div class="kpi"><div class="label">matches played</div><div class="value">${p}<span style="color:#7f93af;font-size:15px"> / 552</span></div><div class="hint">12 fixtures per matchday</div></div><div class="kpi"><div class="label">automatic promotion</div><div class="value" style="color:var(--green)">top 2</div><div class="hint">straight up to division one</div></div><div class="kpi"><div class="label">next fixture date</div><div class="value" style="font-size:20px">${upcoming?prettyDate(upcoming.date):'season done'}</div><div class="hint">${upcoming?`matchday ${upcoming.round}`:'playoffs are ready'}</div></div></div>`}
function renderOverview(){const fs=roundFixtures(state.currentRound);return `${renderKpis()}<div class="grid-main"><section class="card"><div class="card-head"><div><h2>league table</h2><div class="subtle">24 clubs · 46 matches each · 3 points for a win</div></div><span class="status-pill">live standings</span></div>${tableHtml()}</section><section class="card"><div class="card-head"><div><h2>matchday centre</h2><div class="subtle">manage fixtures and enter results</div></div>${roundPicker()}</div><div class="card-body"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><div><strong>matchday ${state.currentRound}</strong><div class="fixture-date">${prettyDate(fs[0]?.date)} · ${fs.filter(f=>f.played).length}/12 played</div></div><button class="btn primary small" data-action="simulate-round" ${fs.every(f=>f.played)?'disabled':''}>simulate matchday</button></div><div class="match-list">${fs.map(matchRow).join('')}</div><div class="helper">use edit to change the teams, date, kickoff or venue · use result to enter a score manually or simulate one match</div></div><div class="card-head" style="border-top:1px solid var(--line);border-bottom:0"><div class="footer-tools"><button class="btn small" data-action="simulate-season" ${playedCount()===552?'disabled':''}>simulate remaining league</button><button class="btn small ghost" data-action="export">export save</button></div></div></section></div>`}
function renderFixtures(){const fs=roundFixtures(state.currentRound);return `<div class="toolbar"><div><h2 class="page-title">fixtures & results</h2><div class="subtle">edit any league fixture, or enter a score yourself</div></div><div class="toolbar-right">${roundPicker()}<button class="btn primary" data-action="simulate-round" ${fs.every(f=>f.played)?'disabled':''}>simulate matchday</button></div></div><section class="card"><div class="card-head"><div><h2>matchday ${state.currentRound}</h2><div class="subtle">${prettyDate(fs[0]?.date)} · 12 fixtures</div></div><span class="status-pill ${fs.every(f=>f.played)?'':'locked'}">${fs.filter(f=>f.played).length} / 12 played</span></div><div class="card-body"><div class="match-list">${fs.map(matchRow).join('')}</div></div></section><div class="toolbar"><div class="subtle">the full schedule contains 552 fixtures across 46 matchdays</div><button class="btn" data-action="simulate-season" ${playedCount()===552?'disabled':''}>simulate remaining season</button></div>`}
function renderClubs(){return `<div class="toolbar"><div><h2 class="page-title">club editor</h2><div class="subtle">rename clubs and adjust their starting strength</div></div><button class="btn ghost" data-action="reset-teams">restore original clubs</button></div><section class="card"><div class="card-head"><div><h2>24 competing clubs</h2><div class="subtle">strength affects simulated results, not the league table directly</div></div></div><div class="card-body"><div class="team-list">${state.teams.map(t=>`<div class="team-editor">${crest(t)}<div><input aria-label="${esc(t.name)} club name" data-team-name="${esc(t.id)}" value="${esc(t.name)}" maxlength="28"><small>${esc(t.stadium)}</small></div><div class="rating"><input aria-label="${esc(t.name)} strength" type="number" min="40" max="99" data-team-strength="${esc(t.id)}" value="${t.strength}"><small>/ 99</small></div></div>`).join('')}</div><div class="helper">strength range: 40–99 · changes apply to future simulated matches</div></div></section>`}
function playoffCard(title,match,extra=''){if(!match)return `<div class="tie-card"><div class="tie-title">${esc(title)}</div><div class="tie-note">waiting for qualification</div></div>`;const h=teamById(match.homeId),a=teamById(match.awayId);return `<div class="tie-card"><div class="tie-title">${esc(title)}</div><div class="tie-row"><span class="${match.winnerId===match.homeId?'winner':''}">${esc(h?.name||'TBC')}</span><span class="tie-score">${match.played?`${match.homeGoals}–${match.awayGoals}`:'—'}</span></div><div class="tie-row"><span class="${match.winnerId===match.awayId?'winner':''}">${esc(a?.name||'TBC')}</span><span class="tie-score">${match.played?' ':' '}</span></div>${match.note?`<div class="tie-note">${esc(match.note)}</div>`:''}${extra?`<div class="tie-note">${esc(extra)}</div>`:''}</div>`}
function renderPlayoffs(){const done=playedCount()===552;if(!done)return `<div class="toolbar"><div><h2 class="page-title">promotion playoffs</h2><div class="subtle">the route to the final promotion place</div></div><span class="status-pill locked">locked · matchday 46</span></div><div class="card"><div class="empty-state"><strong>the playoff bracket is waiting</strong>finish all 46 matchdays to confirm the final league positions and qualify the eight playoff clubs</div><div class="card-body"><div class="rule-grid"><div class="rule"><strong>5th vs 8th</strong><span>single-leg eliminator, hosted by 5th</span></div><div class="rule"><strong>6th vs 7th</strong><span>single-leg eliminator, hosted by 6th</span></div><div class="rule"><strong>3rd & 4th</strong><span>enter directly in the semi-finals</span></div><div class="rule"><strong>one promoted</strong><span>playoff final winner earns promotion</span></div></div></div></div>`;
 if(!state.playoffs)initializePlayoffs();const p=state.playoffs;let action='';let label='';if(p.phase==='eliminator'){action='simulate-eliminators';label='simulate both eliminators'}else if(p.phase==='semifinal'){action='simulate-semis';label='simulate semi-finals'}else if(p.phase==='final'){action='simulate-final';label='simulate playoff final'}else{action='';label='playoffs complete'}
 const elim=p.eliminators||[],semis=p.semis||[];
 return `<div class="toolbar"><div><h2 class="page-title">promotion playoffs</h2><div class="subtle">${p.phase==='complete'?'the promoted club has been decided':`current stage: ${p.phase}`}</div></div><div class="toolbar-right">${p.phase==='complete'?'<span class="status-pill">complete</span>':`<button class="btn primary" data-action="${action}">${label}</button>`}<button class="btn ghost" data-action="simulate-playoffs" ${p.phase==='complete'?'disabled':''}>simulate all playoffs</button></div></div>
 <div class="card" style="margin-bottom:14px"><div class="card-head"><div><h2>eliminator round</h2><div class="subtle">single-leg ties · higher league finisher hosts</div></div><span class="status-pill">5th–8th</span></div><div class="card-body"><div class="bracket" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="bracket-col">${playoffCard('eliminator 1 · 5th hosts 8th',elim[0],elim[0]?.played&&elim[0].winnerId?`winner: ${teamById(elim[0].winnerId).name}`:'')}</div><div class="bracket-col">${playoffCard('eliminator 2 · 6th hosts 7th',elim[1],elim[1]?.played&&elim[1].winnerId?`winner: ${teamById(elim[1].winnerId).name}`:'')}</div></div></div></div>
 <div class="card" style="margin-bottom:14px"><div class="card-head"><div><h2>semi-finals</h2><div class="subtle">two legs · 3rd and 4th host the second leg</div></div><span class="status-pill">3rd & 4th enter here</span></div><div class="card-body"><div class="bracket"><div class="bracket-col"><h3>semi-final 1 · lower-ranked eliminator winner vs 3rd</h3>${semis[0]?playoffCard('first leg · eliminator winner hosts',semis[0].legs[0]):playoffCard('first leg',null)}${semis[0]?playoffCard('second leg · 3rd hosts',semis[0].legs[1]):playoffCard('second leg',null)}${semis[0]?.winnerId?`<div class="status-pill">through: ${esc(teamById(semis[0].winnerId).name)}</div>`:''}</div><div class="bracket-col"><h3>semi-final 2 · other eliminator winner vs 4th</h3>${semis[1]?playoffCard('first leg · eliminator winner hosts',semis[1].legs[0]):playoffCard('first leg',null)}${semis[1]?playoffCard('second leg · 4th hosts',semis[1].legs[1]):playoffCard('second leg',null)}${semis[1]?.winnerId?`<div class="status-pill">through: ${esc(teamById(semis[1].winnerId).name)}</div>`:''}</div><div class="bracket-col"><h3>promotion final</h3>${playoffCard('neutral venue · one match',p.final,p.final?.winnerId?`promoted: ${teamById(p.final.winnerId).name}`:'winner earns promotion')}<div class="tie-note">${p.phase==='complete'&&p.winnerId?`<strong style="color:var(--green)">${esc(teamById(p.winnerId).name)} promoted to division one</strong>`:'the semi-final winners meet here'}</div></div></div></div></div>
 <div class="info-box">semi-final seeding: the lower-ranked of the two eliminator winners faces 3rd place. the other winner faces 4th. the team finishing 3rd or 4th always hosts leg two.</div>`}
function renderModal(){if(!state.modal)return '';const m=state.modal,f=state.fixtures.find(x=>x.id===m.id);if(!f)return '';const h=teamById(f.homeId),a=teamById(f.awayId);
 if(m.type==='edit')return `<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>customize fixture</h2><button class="btn small ghost" data-action="close-modal">✕</button></div><form id="edit-form" class="modal-body"><input type="hidden" name="id" value="${esc(f.id)}"><div class="form-grid"><div class="field full"><label>home team</label><select name="homeId">${teamOptionList(f.homeId)}</select></div><div class="field full"><label>away team</label><select name="awayId">${teamOptionList(f.awayId)}</select></div><div class="field"><label>date</label><input type="date" name="date" value="${esc(f.date)}" required></div><div class="field"><label>kickoff</label><input type="time" name="kickoff" value="${esc(f.kickoff||'15:00')}" required></div><div class="field full"><label>venue</label><input name="venue" value="${esc(f.venue||h?.stadium||'') }" maxlength="48"></div></div><div class="helper">changing either team clears the old score. fixtures can be customized freely, even if that creates repeat opponents.</div><div class="modal-actions"><button type="button" class="btn ghost" data-action="close-modal">cancel</button><button class="btn primary" type="submit">save fixture</button></div></form></section></div>`;
 if(m.type==='result')return `<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>enter match result</h2><button class="btn small ghost" data-action="close-modal">✕</button></div><form id="result-form" class="modal-body"><input type="hidden" name="id" value="${esc(f.id)}"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px"><div style="display:flex;align-items:center;gap:8px;font-weight:800">${crest(h,true)}${esc(h?.name||'Home')}</div><div style="font-size:10px;color:#8fa4bf">vs</div><div style="display:flex;align-items:center;gap:8px;font-weight:800">${esc(a?.name||'Away')}${crest(a,true)}</div></div><div class="form-grid"><div class="field"><label>home goals</label><input type="number" name="homeGoals" min="0" max="20" required value="${f.played?f.homeGoals:''}"></div><div class="field"><label>away goals</label><input type="number" name="awayGoals" min="0" max="20" required value="${f.played?f.awayGoals:''}"></div></div><div class="modal-actions" style="justify-content:space-between"><button type="button" class="btn" data-action="simulate-one" data-id="${esc(f.id)}">simulate match</button><div style="display:flex;gap:8px"><button type="button" class="btn ghost" data-action="close-modal">cancel</button><button type="submit" class="btn primary">save result</button></div></div></form></section></div>`;
 return '';
}
function render(){const root=document.getElementById('app');const tabs=[['overview','overview'],['fixtures','fixtures & results'],['clubs','club editor'],['playoffs','playoffs']];let content=state.activeTab==='overview'?renderOverview():state.activeTab==='fixtures'?renderFixtures():state.activeTab==='clubs'?renderClubs():renderPlayoffs();root.innerHTML=`<header class="topbar"><div class="brand"><div class="crest">2D</div><div><div class="eyebrow">the road to division one</div><h1>second division</h1><p>24 clubs · one season · one promotion battle</p></div></div><div class="season-pill">${esc(state.season)} season</div></header><main class="shell"><nav class="nav">${tabs.map(([id,label])=>`<button data-tab="${id}" class="${state.activeTab===id?'active':''}">${label}</button>`).join('')}</nav>${content}<div class="toolbar" style="margin-top:20px"><div class="subtle">autosaved in this browser · customize clubs, fixtures and results</div><div class="footer-tools"><button class="btn small ghost" data-action="export">export save</button><button class="btn small ghost" data-action="import">import save</button><button class="btn small danger" data-action="reset">reset season</button><input id="import-file" type="file" accept="application/json" class="hidden"></div></div></main>${renderModal()}<div id="toast" class="toast"></div>`;}
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.style.display='none'},2200)}
function randomGoals(lambda){const L=Math.max(.15,Math.min(3.2,lambda));const limit=Math.exp(-L);let k=0,p=1;do{k++;p*=Math.random()}while(p>limit&&k<9);return Math.max(0,Math.min(8,k-1))}
function simulatedScore(homeId,awayId){const h=teamById(homeId),a=teamById(awayId);const diff=(h.strength-a.strength)/18;const hg=randomGoals(1.32+diff*.43+.17);const ag=randomGoals(1.13-diff*.38);return [hg,ag]}
function setFixtureResult(f,hg,ag){f.homeGoals=Number(hg);f.awayGoals=Number(ag);f.played=true;}
function simulateFixture(f){const [hg,ag]=simulatedScore(f.homeId,f.awayId);setFixtureResult(f,hg,ag)}
function simulateRound(){const fs=roundFixtures(state.currentRound).filter(f=>!f.played);if(!fs.length)return toast('this matchday is already complete');fs.forEach(simulateFixture);afterLeagueUpdate();save();render();toast(`matchday ${state.currentRound} simulated`)}
function simulateSeason(){if(!confirm('simulate every remaining league fixture? this will play all unplayed matches.'))return;state.fixtures.filter(f=>!f.played).forEach(simulateFixture);afterLeagueUpdate();save();render();toast('the 46-match season is complete')}
function afterLeagueUpdate(){state.playoffs=null;if(playedCount()===552){state.activeTab='playoffs';initializePlayoffs();}}
function initializePlayoffs(){if(playedCount()!==552)return;const t=stats();const at=pos=>t[pos-1].team.id;state.playoffs={phase:'eliminator',eliminators:[{id:'E1',homeId:at(5),awayId:at(8),played:false,homeGoals:null,awayGoals:null,winnerId:null,note:''},{id:'E2',homeId:at(6),awayId:at(7),played:false,homeGoals:null,awayGoals:null,winnerId:null,note:''}],semis:[],final:null,winnerId:null};}
function knockoutWinner(homeId,awayId,hg,ag){if(hg!==ag)return hg>ag?homeId:awayId;const h=teamById(homeId),a=teamById(awayId);const p=1/(1+Math.exp(-(h.strength-a.strength)/9));return Math.random()<p?homeId:awayId}
function simulateEliminator(tie){if(tie.played)return;const [hg,ag]=simulatedScore(tie.homeId,tie.awayId);tie.homeGoals=hg;tie.awayGoals=ag;tie.played=true;tie.winnerId=knockoutWinner(tie.homeId,tie.awayId,hg,ag);tie.note=hg===ag?'decided on penalties':`winner: ${teamById(tie.winnerId).name}`;}
function prepareSemis(){const p=state.playoffs;if(p.phase!=='eliminator'||!p.eliminators.every(x=>x.played))return;const winners=p.eliminators.map(x=>({id:x.winnerId,rank:rankOf(x.winnerId)})).sort((a,b)=>b.rank-a.rank);const table=stats(),third=table[2].team.id,fourth=table[3].team.id;const lower=winners[0].id,better=winners[1].id;p.semis=[makeSemi('S1',lower,third),makeSemi('S2',better,fourth)];p.phase='semifinal';}
function makeSemi(id,qualifier,seed){return {id,qualifierId:qualifier,seedId:seed,legs:[{id:id+'-1',homeId:qualifier,awayId:seed,played:false,homeGoals:null,awayGoals:null,note:''},{id:id+'-2',homeId:seed,awayId:qualifier,played:false,homeGoals:null,awayGoals:null,note:''}],winnerId:null,aggregate:null,note:''};}
function simulateLeg(leg){if(leg.played)return;const [hg,ag]=simulatedScore(leg.homeId,leg.awayId);leg.homeGoals=hg;leg.awayGoals=ag;leg.played=true;}
function completeSemi(semi){if(!semi.legs.every(x=>x.played))return;const one=semi.legs[0],two=semi.legs[1];const totals={};totals[one.homeId]=(totals[one.homeId]||0)+one.homeGoals;totals[one.awayId]=(totals[one.awayId]||0)+one.awayGoals;totals[two.homeId]=(totals[two.homeId]||0)+two.homeGoals;totals[two.awayId]=(totals[two.awayId]||0)+two.awayGoals;const q=semi.qualifierId,s=semi.seedId;semi.aggregate=`${teamById(q).short} ${totals[q]}–${totals[s]} ${teamById(s).short}`;if(totals[q]!==totals[s])semi.winnerId=totals[q]>totals[s]?q:s;else{semi.winnerId=knockoutWinner(q,s,totals[q],totals[s]);semi.note='aggregate level · decided after extra time / penalties';} }
function prepareFinal(){const p=state.playoffs;if(p.phase!=='semifinal'||!p.semis.every(s=>s.winnerId))return;const a=p.semis[0].winnerId,b=p.semis[1].winnerId;const rA=rankOf(a),rB=rankOf(b);p.final={id:'FINAL',homeId:rA<rB?a:b,awayId:rA<rB?b:a,played:false,homeGoals:null,awayGoals:null,winnerId:null,note:'neutral venue · national stadium'};p.phase='final';}
function simulatePlayoffFinal(){const p=state.playoffs;if(!p||p.phase!=='final'||p.final.played)return;const [hg,ag]=simulatedScore(p.final.homeId,p.final.awayId);p.final.homeGoals=hg;p.final.awayGoals=ag;p.final.played=true;p.final.winnerId=knockoutWinner(p.final.homeId,p.final.awayId,hg,ag);if(hg===ag)p.final.note='decided after extra time / penalties · neutral venue';p.winnerId=p.final.winnerId;p.phase='complete';}
function runEliminators(){const p=state.playoffs;if(!p)return;p.eliminators.forEach(simulateEliminator);prepareSemis();save();render();toast('eliminator winners confirmed')}
function runSemis(){const p=state.playoffs;if(!p||p.phase!=='semifinal')return;p.semis.forEach(s=>{s.legs.forEach(simulateLeg);completeSemi(s)});prepareFinal();save();render();toast('semi-final aggregate scores confirmed')}
function runAllPlayoffs(){if(!state.playoffs)initializePlayoffs();const p=state.playoffs;if(!p)return;if(p.phase==='eliminator'){p.eliminators.forEach(simulateEliminator);prepareSemis()}if(p.phase==='semifinal'){p.semis.forEach(s=>{s.legs.forEach(simulateLeg);completeSemi(s)});prepareFinal()}if(p.phase==='final')simulatePlayoffFinal();save();render();toast('playoff campaign complete')}
function openModal(type,id){state.modal={type,id};render()}
function exportSave(){const data=JSON.stringify({...state,modal:null},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='second-division-save.json';a.click();URL.revokeObjectURL(url);toast('save exported')}
function importSave(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.teams)||x.teams.length!==24||!Array.isArray(x.fixtures)||x.fixtures.length!==552)throw new Error('invalid save');state={...freshState(),...x,modal:null};save();render();toast('save imported')}catch(e){alert('that save file is not valid for this game.')}};reader.readAsText(file)}
const root=document.getElementById('app');
root.addEventListener('click',e=>{
 const tab=e.target.closest('[data-tab]');if(tab){state.activeTab=tab.dataset.tab;save();render();return;}
 const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='edit-fixture')openModal('edit',id);
 else if(action==='result')openModal('result',id);
 else if(action==='close-modal'){state.modal=null;render();}
 else if(action==='backdrop'&&e.target.classList.contains('modal-backdrop')){state.modal=null;render();}
 else if(action==='prev-round'){state.currentRound=Math.max(1,state.currentRound-1);save();render();}
 else if(action==='next-round'){state.currentRound=Math.min(46,state.currentRound+1);save();render();}
 else if(action==='simulate-round')simulateRound();
 else if(action==='simulate-season')simulateSeason();
 else if(action==='simulate-one'){const f=state.fixtures.find(x=>x.id===id);if(f){simulateFixture(f);state.modal=null;afterLeagueUpdate();save();render();toast('match simulated')}}
 else if(action==='simulate-eliminators')runEliminators();
 else if(action==='simulate-semis')runSemis();
 else if(action==='simulate-final'){simulatePlayoffFinal();save();render();toast('promotion winner confirmed')}
 else if(action==='simulate-playoffs')runAllPlayoffs();
 else if(action==='export')exportSave();
 else if(action==='import')document.getElementById('import-file')?.click();
 else if(action==='reset'){if(confirm('reset all clubs, fixtures, scores and playoff progress?')){state=freshState();save();render();toast('season reset')}}
 else if(action==='reset-teams'){if(confirm('restore the original 24 club names and strengths? existing scores and fixtures stay as they are.')){const fresh=TEAM_SEED.map(([id,name,short,color,strength,stadium])=>({id,name,short,color,strength,stadium}));state.teams=fresh;save();render();toast('original clubs restored')}}
});
root.addEventListener('change',e=>{
 if(e.target.matches('[data-role="round-select"]')){state.currentRound=Number(e.target.value);save();render();}
 if(e.target.matches('[data-team-name]')){const t=teamById(e.target.dataset.teamName);const value=e.target.value.trim();if(t&&value){const duplicate=state.teams.some(x=>x.id!==t.id&&x.name.toLowerCase()===value.toLowerCase());if(duplicate){alert('each club needs a unique name');e.target.value=t.name;return;}t.name=value;save();render();toast('club renamed')}}
 if(e.target.matches('[data-team-strength]')){const t=teamById(e.target.dataset.teamStrength);if(t){t.strength=Math.max(40,Math.min(99,Number(e.target.value)||40));save();render();toast('club strength updated')}}
 if(e.target.id==='import-file'&&e.target.files?.[0])importSave(e.target.files[0]);
});
root.addEventListener('submit',e=>{
 if(e.target.id==='edit-form'){e.preventDefault();const d=new FormData(e.target),f=state.fixtures.find(x=>x.id===d.get('id'));if(!f)return;const homeId=d.get('homeId'),awayId=d.get('awayId');if(homeId===awayId){alert('a club cannot play itself');return;}const changed=f.homeId!==homeId||f.awayId!==awayId;f.homeId=homeId;f.awayId=awayId;f.date=d.get('date');f.kickoff=d.get('kickoff');f.venue=d.get('venue').trim();if(changed){f.played=false;f.homeGoals=null;f.awayGoals=null;}state.modal=null;afterLeagueUpdate();save();render();toast('fixture customized');}
 if(e.target.id==='result-form'){e.preventDefault();const d=new FormData(e.target),f=state.fixtures.find(x=>x.id===d.get('id'));if(!f)return;const hg=Number(d.get('homeGoals')),ag=Number(d.get('awayGoals'));if(!Number.isInteger(hg)||!Number.isInteger(ag)||hg<0||ag<0||hg>20||ag>20){alert('enter goals between 0 and 20');return;}setFixtureResult(f,hg,ag);state.modal=null;afterLeagueUpdate();save();render();toast('result saved · table updated');}
});
loadSave();if(playedCount()===552&&!state.playoffs)initializePlayoffs();render();save();
</script>
</body>
</html>
